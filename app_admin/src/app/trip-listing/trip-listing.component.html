<div class="d-flex justify-content-between align-items-center mt-3">
  <h2>Trips</h2>
  <button type="button" class="btn btn-primary" (click)="addTrip()">Add Trip</button>
</div>

<div *ngIf="message" class="alert alert-info mt-3">{{ message }}</div>

<div class="row">
  <div *ngFor="let trip of trips" class="col-md-4">
    <app-trip-card [trip]="trip" (deleted)="getTrips()" class="card-deck mt-2"></app-trip-card>
  </div>
</div>
