<div class="card mb-3">
  <img class="card-img-top" [src]="'assets/images/' + trip.image" [alt]="trip.name">
  <div class="card-body">
    <h5 class="card-title">{{ trip.name }}</h5>
    <p class="card-text mb-1"><strong>Code:</strong> {{ trip.code }}</p>
    <p class="card-text mb-1"><strong>Length:</strong> {{ trip.length }}</p>
    <p class="card-text mb-1"><strong>Start:</strong> {{ trip.start | date: 'longDate' }}</p>
    <p class="card-text mb-1"><strong>Resort:</strong> {{ trip.resort }}</p>
    <p class="card-text mb-2"><strong>Price:</strong> {{ trip.perPerson | currency: 'USD' : 'symbol' }}</p>
    <div class="card-text" [innerHTML]="trip.description"></div>
    <div class="mt-3" *ngIf="isLoggedIn()">
      <button type="button" class="btn btn-info me-2" (click)="editTrip(trip)">Edit</button>
      <button type="button" class="btn btn-danger" (click)="deleteTrip(trip)">Delete</button>
    </div>
  </div>
</div>
